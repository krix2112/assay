services:
  assay-db:
    image: postgres:16-alpine
    container_name: assay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assay
    ports:
      - "5432:5432"
    volumes:
      - assay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  assay_pgdata:
    name: assay_pgdata
